<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nari</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script>
    (function () {
      var sessionKey = "nari_demo_session";
      var cookieMatch = document.cookie.match(/(?:^|;\s*)nari_demo_session=([^;]+)/);
      if (!cookieMatch) {
        return;
      }

      try {
        sessionStorage.setItem(sessionKey, decodeURIComponent(cookieMatch[1]));
      } catch (error) {}

      document.cookie = "nari_demo_session=;expires=Thu, 01 Jan 1970 00:00:00 GMT;path=/";
    })();
  </script>
  <script type="module" crossorigin src="/demo/assets/app-BBUA2OMB.js"></script>
  <link rel="stylesheet" crossorigin href="/demo/assets/app-B9kBHZoA.css">
</head>
<body>
  <div id="root"></div>
  <script src="/demo/embed-url-normalizer.js"></script>
  <script src="/demo/embed-analytics.js"></script>
  <script src="https://app.aevra.co/embed.js"></script>
</body>
</html>
