<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nari</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script type="module" crossorigin src="/demo/assets/app-BBUA2OMB.js"></script>
  <link rel="stylesheet" crossorigin href="/demo/assets/app-B9kBHZoA.css">
</head>
<body>
  <div id="root"></div>
  <script>
    // Restore embed.js session from cookie (survives cross-port navigation)
    (function () {
      var m = document.cookie.match(/(?:^|;\s*)nari_demo_session=([^;]+)/);
      if (m) {
        try { sessionStorage.setItem('nari_demo_session', decodeURIComponent(m[1])); } catch (e) {}
        document.cookie = 'nari_demo_session=;expires=Thu, 01 Jan 1970 00:00:00 GMT;path=/';
      }
    })();
  </script>
  <script src="/demo/embed-url-normalizer.js"></script>
  <script src="https://app.aevra.co/embed.js"></script>
</body>
</html>
